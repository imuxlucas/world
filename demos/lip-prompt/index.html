<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>唇妆反差钩子 · 词槽输入</title>
  <style>
    @font-face { font-family:ODNumber; src:url('/fonts/ODNumber-Regular.ttf') format('truetype'); font-style:normal; font-weight:400; font-display:swap; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; }
    body { display:grid; grid-template: minmax(0,1fr) / minmax(0,1fr); place-items:center; overflow:hidden; background:#f5f5f7; font-family:'PingFang SC',sans-serif; font-size:14px; line-height:22px; color:#000; }
    body[data-orbit="true"] { background:transparent; }
    button:not([data-scope="button"]),input,textarea { font:inherit; color:inherit; }
    button { cursor:pointer; border:0; margin:0; }
    button:focus-visible { outline:2px solid #8d8d8d; outline-offset:3px; }
    .composer svg { display:block; width:16px; height:16px; flex:none; }
    .composer { width:412px; height:200px; padding:16px; border-radius:24px; background:#fff; box-shadow:inset 0 0 0 .5px rgb(0 0 0 / 23%),0 0 32px rgb(0 0 0 / 6%); display:flex; flex-direction:column; justify-content:space-between; transform:scale(var(--composer-scale,1)); transform-origin:center; margin:0; }
    .composer:has(.prompt:focus, .slot-value input:focus) { box-shadow:inset 0 0 0 1px rgb(0 0 0 / 23%),0 0 32px rgb(0 0 0 / 6%); }
    .prompt { padding:0 6px; flex:1; min-height:0; overflow:auto; scrollbar-width:none; outline:none; font-weight:400; overflow-wrap:anywhere; }
    .prompt::-webkit-scrollbar { display:none; }
    .prompt-row { min-height:22px; margin-bottom:4px; }
    .prompt-row:last-child { margin-bottom:0; }
    .prompt-row > * { vertical-align:top; }
    .prompt-row > :not(:last-child) { margin-right:4px; }
    .slash { font-weight:500; color:rgb(0 0 0 / 41%); }
    .skill-name { font-weight:500; }
    .prompt-copy { font-weight:400; }
    .slot { display:inline-flex; align-items:stretch; min-width:0; max-width:100%; height:22px; border-radius:4px; box-shadow:inset 0 0 0 1px #ebebeb; overflow:hidden; }
    .slot-label { padding:0 4px; flex:none; font-weight:500; color:rgb(0 0 0 / 61%); }
    .slot-value { position:relative; display:inline-block; min-width:8px; max-width:240px; }
    .slot-value input,.slot-measure { padding:0 4px; font-weight:400; line-height:22px; }
    .slot-measure { display:block; width:max-content; max-width:240px; height:22px; overflow:hidden; visibility:hidden; white-space:pre; pointer-events:none; }
    .slot-value input { position:absolute; inset:0; display:block; width:100%; height:22px; min-width:0; max-width:240px; border:0; border-radius:0; outline:none; background:transparent; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .slot-value input::placeholder { color:rgb(0 0 0 / 41%); opacity:1; }
    .slot-value:hover input,.slot-value input:focus,.slot-value input:not(:placeholder-shown) { background:#ebebeb; }
    .slot-expand { position:absolute; top:0; right:0; height:22px; padding:3px 4px 3px 12px; background:linear-gradient(270deg,#ebebeb 70%,rgb(235 235 235 / 0%) 100%); opacity:0; pointer-events:none; transition:opacity 120ms ease; }
    .slot-value:hover .slot-expand,.slot-expand:focus-visible { opacity:1; pointer-events:auto; }
    .reference { display:inline-flex; align-items:center; gap:4px; padding:0 4px; height:22px; max-width:160px; flex:none; border-radius:4px; background:rgb(0 0 0 / 5%); color:rgb(0 0 0 / 61%); font-weight:400; }
    .reference:hover { background:rgb(0 0 0 / 8%); }
    .reference-label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .reference img { width:16px; height:16px; object-fit:cover; border-radius:2px; }
    .reference img[hidden],.reference svg[hidden] { display:none; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; flex:none; margin-top:8px; }
    .add { width:36px; height:36px; display:grid; place-items:center; padding:0; border-radius:8px; background:transparent; }
    .add:hover { background:rgb(0 0 0 / 5%); }
    .toolbar-right { display:flex; align-items:center; gap:8px; }
    .credits { display:flex; align-items:center; gap:2px; font-weight:400; }
    .credits-number { font-family:ODNumber,'PingFang SC',sans-serif; font-size:14px; line-height:22px; }
    .send { width:36px; height:36px; padding:0; display:grid; place-items:center; border-radius:18px; background:#000; }
    .send:hover { background:rgb(0 0 0 / 76%); }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  </style>
</head>
<body>
  <form class="composer" aria-label="唇妆反差钩子提示词">
    <div class="prompt" contenteditable="true" role="textbox" aria-label="提示词内容" aria-multiline="true" spellcheck="false">
      <div class="prompt-row"><span class="slash">/</span><span class="skill-name">唇妆反差钩子</span><span class="prompt-copy">砧板上菜刀切割</span></div>
      <div class="prompt-row"><span class="slot" contenteditable="false"><span class="slot-label">商品名称</span><span class="slot-value"><span class="slot-measure" aria-hidden="true">示例：Dior 999 口红</span><input name="product" aria-label="商品名称" placeholder="示例：Dior 999 口红" autocomplete="off"><button class="slot-expand" type="button" aria-label="放大商品名称输入框" aria-haspopup="dialog"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.31093 9.13346C2.61761 9.13346 2.86625 9.38239 2.86648 9.68902V12.3487L5.82916 9.38607C6.04611 9.16911 6.39866 9.16911 6.61561 9.38607C6.83188 9.60302 6.83219 9.9549 6.61561 10.1717L3.65381 13.1335H6.31093C6.61775 13.1335 6.86648 13.3831 6.86648 13.6899C6.86625 13.9965 6.61761 14.2446 6.31093 14.2446L2.31093 14.2454C2.20311 14.2454 2.09588 14.2131 2.00277 14.1508C1.91171 14.0899 1.83927 14.0034 1.79704 13.9008C1.79129 13.8868 1.78857 13.8718 1.78402 13.8574C1.76706 13.8042 1.75537 13.7479 1.75537 13.689V9.68902C1.75561 9.38239 2.00425 9.13346 2.31093 9.13346ZM13.6885 1.75586C13.7243 1.75586 13.7601 1.75942 13.7953 1.76628C13.8108 1.76929 13.8254 1.77503 13.8404 1.7793C13.9285 1.8043 14.0125 1.84899 14.0818 1.91819C14.1075 1.94393 14.13 1.97287 14.1503 2.00326C14.1582 2.01507 14.1634 2.02832 14.1703 2.04058C14.1812 2.05996 14.193 2.07887 14.2016 2.09961C14.2062 2.11091 14.209 2.1228 14.2128 2.13433C14.2317 2.19017 14.2441 2.24921 14.2441 2.31141V6.31141C14.2441 6.61824 13.9954 6.86697 13.6885 6.86697C13.3818 6.86688 13.133 6.61819 13.133 6.31141V3.65343L10.1712 6.61523C9.95424 6.83216 9.60168 6.83211 9.38471 6.61523C9.16807 6.39831 9.16801 6.04653 9.38471 5.82964L12.3474 2.86697H9.68853C9.38178 2.86688 9.13298 2.61819 9.13298 2.31141C9.13309 2.00474 9.38185 1.75595 9.68853 1.75586H13.6885Z" fill="black" fill-opacity=".61"/></svg></button></span></span></div>
      <div class="prompt-row"><span class="prompt-copy">包装盒制造反差，硬切唇部微距上妆特写，</span><button class="reference" contenteditable="false" type="button" aria-label="添加商品图">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8.00041 1.75586C8.30707 1.75605 8.55596 2.00471 8.55596 2.31141V7.4451H13.6888C13.9956 7.4451 14.2443 7.69383 14.2443 8.00065C14.2442 8.30733 13.9955 8.55621 13.6888 8.55621H8.55596V13.689C8.55596 13.9957 8.30707 14.2444 8.00041 14.2446C7.69358 14.2446 7.44485 13.9958 7.44485 13.689V8.55621H2.31117C2.00445 8.55621 1.75579 8.30733 1.75562 8.00065C1.75562 7.69383 2.00435 7.4451 2.31117 7.4451H7.44485V2.31141C7.44485 2.00459 7.69358 1.75586 8.00041 1.75586Z" fill="black" fill-opacity=".61"/></svg>
        <img hidden alt="商品参考图"><span class="reference-label">添加商品图</span>
      </button></div>
      <div class="prompt-row"><span class="prompt-copy">参考产品外观，定格水润完妆唇效。</span></div>
    </div>
    <div class="toolbar">
      <button class="add" type="button" aria-label="添加参考图片"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8.00041 1.75586C8.30707 1.75605 8.55596 2.00471 8.55596 2.31141V7.4451H13.6888C13.9956 7.4451 14.2443 7.69383 14.2443 8.00065C14.2442 8.30733 13.9955 8.55621 13.6888 8.55621H8.55596V13.689C8.55596 13.9957 8.30707 14.2444 8.00041 14.2446C7.69358 14.2446 7.44485 13.9958 7.44485 13.689V8.55621H2.31117C2.00445 8.55621 1.75579 8.30733 1.75562 8.00065C1.75562 7.69383 2.00435 7.4451 2.31117 7.4451H7.44485V2.31141C7.44485 2.00459 7.69358 1.75586 8.00041 1.75586Z" fill="black"/></svg></button>
      <div class="toolbar-right">
        <span class="credits" aria-label="每秒 3 积分"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.44572 8.86697C4.71055 8.86697 4.93858 9.05391 4.99052 9.31359C5.08221 9.77204 5.25869 10.1503 5.51951 10.4312C5.77538 10.7067 6.14066 10.9196 6.67038 11.0079C6.93826 11.0525 7.13461 11.2843 7.13461 11.5559C7.13461 11.8274 6.93826 12.0592 6.67038 12.1039C6.14066 12.1922 5.77538 12.405 5.51951 12.6805C5.25869 12.9614 5.08221 13.3397 4.99052 13.7981C4.93858 14.0578 4.71055 14.2447 4.44572 14.2447C4.1809 14.2447 3.95287 14.0578 3.90093 13.7981C3.80924 13.3397 3.63276 12.9614 3.37194 12.6805C3.11607 12.405 2.75079 12.1922 2.22107 12.1039C1.95319 12.0592 1.75684 11.8274 1.75684 11.5559C1.75684 11.2843 1.95319 11.0525 2.22107 11.0079C2.75079 10.9196 3.11607 10.7067 3.37194 10.4312C3.63276 10.1503 3.80924 9.77204 3.90093 9.31359C3.95287 9.05391 4.1809 8.86697 4.44572 8.86697ZM9.24573 1.75586C9.51055 1.75586 9.73858 1.94279 9.79052 2.20247C9.99776 3.2387 10.4054 4.13694 11.0417 4.82227C11.6732 5.50226 12.5584 6.00401 13.7815 6.20786C14.0494 6.2525 14.2457 6.48428 14.2457 6.75586C14.2457 7.02744 14.0494 7.25922 13.7815 7.30386C12.5584 7.50771 11.6732 8.00945 11.0417 8.68945C10.4054 9.37478 9.99776 10.273 9.79052 11.3092C9.73858 11.5689 9.51055 11.7559 9.24573 11.7559C8.9809 11.7559 8.75287 11.5689 8.70093 11.3092C8.49368 10.273 8.08609 9.37478 7.44972 8.68945C6.81829 8.00945 5.93303 7.50771 4.70996 7.30386C4.44208 7.25922 4.24572 7.02744 4.24572 6.75586C4.24572 6.48428 4.44208 6.2525 4.70996 6.20786C5.93303 6.00401 6.81829 5.50226 7.44972 4.82227C8.08609 4.13694 8.49368 3.2387 8.70093 2.20247C8.75287 1.94279 8.9809 1.75586 9.24573 1.75586Z" fill="black" fill-opacity=".61"/></svg><span><span class="credits-number">3</span>/s</span></span>
        <button class="send" type="submit" aria-label="发送提示词"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8.01294 1.40126C8.04064 1.4019 8.06802 1.40519 8.0954 1.40994C8.10474 1.41156 8.114 1.41307 8.12318 1.41515C8.14711 1.42057 8.17031 1.42823 8.19349 1.43685C8.20305 1.44042 8.21283 1.4432 8.22214 1.44727C8.24846 1.45874 8.27388 1.47232 8.29852 1.48806C8.30279 1.49079 8.30736 1.49304 8.31154 1.49588C8.34017 1.5153 8.36778 1.53737 8.39314 1.56272L12.6596 5.83008C12.8763 6.04706 12.8765 6.39881 12.6596 6.61567C12.4427 6.83242 12.091 6.8323 11.874 6.61567L8.55547 3.29709V14.0445C8.55535 14.3512 8.30666 14.6 7.99991 14.6C7.69324 14.5999 7.44448 14.3512 7.44436 14.0445V3.29709L4.12667 6.61567C3.90975 6.83256 3.55718 6.83251 3.34022 6.61567C3.12348 6.39883 3.12367 6.04704 3.34022 5.83008L7.60756 1.56272C7.63257 1.53773 7.65977 1.51488 7.68915 1.49501L7.69436 1.49154C7.75189 1.45358 7.81496 1.42773 7.88012 1.41341C7.88897 1.41146 7.89803 1.41059 7.90703 1.40907C7.9341 1.4045 7.96125 1.40182 7.98863 1.40126C7.99239 1.40118 7.99614 1.40039 7.99991 1.40039C8.00421 1.40039 8.00866 1.40116 8.01294 1.40126Z" fill="white" stroke="white" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <input id="reference-file" type="file" accept="image/*" hidden>
    <span class="sr-only" role="status" aria-live="polite"></span>
  </form>
  <script>
    const composer=document.querySelector('.composer');
    document.body.dataset.orbit=String(new URLSearchParams(location.search).has('orbit'));
    const thumbnail=new URLSearchParams(location.search).has('thumbnail');
    const fit=()=>{const margin=thumbnail?8:48;composer.style.setProperty('--composer-scale',Math.max(.1,Math.min(1,(innerWidth-margin)/412,(innerHeight-margin)/200)));};
    new ResizeObserver(fit).observe(document.body);fit();
    if(thumbnail){document.body.inert=true;document.body.setAttribute('aria-hidden','true');}
    const prompt=document.querySelector('.prompt');
    const resizeSlot=product=>{
      const field=product.closest('.slot-value');
      const measure=field.querySelector('.slot-measure');
      measure.textContent=product.placeholder;
      field.style.minWidth=getComputedStyle(measure).width;
      measure.textContent=product.value||product.placeholder;
    };
    prompt.querySelectorAll('[name="product"]').forEach(resizeSlot);
    document.fonts.ready.then(()=>prompt.querySelectorAll('[name="product"]').forEach(resizeSlot));
    prompt.addEventListener('input',event=>{if(event.target.matches('[name="product"]'))resizeSlot(event.target);});
    prompt.addEventListener('click',event=>{
      if(event.target.closest('.reference')){fileInput.click();return;}
    });
    // Paste plain text so the large input keeps its own typography.
    prompt.addEventListener('paste',event=>{
      if(event.target.closest('input'))return;
      event.preventDefault();document.execCommand('insertText',false,event.clipboardData.getData('text/plain'));
    });
    const fileInput=document.querySelector('#reference-file');
    const referenceTemplate=document.querySelector('.reference').cloneNode(true);
    document.querySelector('.add').addEventListener('click',()=>fileInput.click());
    let referenceUrl;
    fileInput.addEventListener('change',()=>{
      const file=fileInput.files[0];if(!file||!file.type.startsWith('image/'))return;
      let reference=prompt.querySelector('.reference');
      if(!reference){reference=referenceTemplate.cloneNode(true);prompt.append(reference);}
      if(referenceUrl)URL.revokeObjectURL(referenceUrl);
      referenceUrl=URL.createObjectURL(file);
      const image=reference.querySelector('img');image.src=referenceUrl;image.hidden=false;
      reference.querySelector('svg').setAttribute('hidden','');
      reference.querySelector('.reference-label').textContent=file.name;
      reference.setAttribute('aria-label',`更换商品图：${file.name}`);
      reference.title=file.name;
    });
    composer.addEventListener('submit',event=>{
      event.preventDefault();
      const product=prompt.querySelector('[name="product"]');
      const text=prompt.cloneNode(true);
      text.querySelectorAll('.slot').forEach(slot=>{slot.textContent=product?.value||'';});
      text.querySelectorAll('.reference').forEach(chip=>chip.remove());
      composer.dispatchEvent(new CustomEvent('prompt-submit',{bubbles:true,detail:{prompt:text.textContent.trim(),product:product?.value||'',reference:prompt.querySelector('.reference')?fileInput.files[0]||null:null}}));
      document.querySelector('[role="status"]').textContent='提示词已准备';
    });
  </script>
  <script type="module" src="/src/demos/LipPromptPopover.tsx"></script>
</body>
</html>
